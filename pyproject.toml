[project]
name = "rfc-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
]

[project.scripts]
rfc = "rfc_rag.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfc_rag"]
