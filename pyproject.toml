[project]
name = "rfc-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "fastembed>=0.9.1",
]

[project.scripts]
rfc = "rfc_rag.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
frameworks = [
    "langchain-openai>=1.7.4",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-llms-openai-like>=0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfc_rag"]
artifacts = ["src/rfc_rag/interfaces/static/*"]
