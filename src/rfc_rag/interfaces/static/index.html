<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFC Chat</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1c1c1a; --muted: #6b6b66;
    --line: #e4e3df; --accent: #2b5fd9; --warn: #9a6b00; --warn-bg: #fdf6e3;
    --dead: #a33; --ok: #2f7d4f; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a; --panel: #1f1f23; --ink: #e8e8e6; --muted: #9a9a95;
      --line: #32323a; --accent: #7aa2f7; --warn: #d7a93e; --warn-bg: #2a2416;
      --dead: #e0706a; --ok: #6fbf8b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #meter { min-width: 150px; }
  #meter .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #meter .fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  #meter .fill.full { background: var(--dead); }
  #meter .label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }

  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .turn { display: flex; flex-direction: column; gap: 6px; }
  .turn.user { align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: var(--radius); max-width: 88%;
    border: 1px solid var(--line); background: var(--panel);
  }
  .turn.user .bubble { background: var(--accent); color: #fff; border-color: transparent; }
  .turn.user .resolved { font-size: 11px; color: var(--muted); }

  .quote {
    margin: 10px 0 6px; padding: 9px 12px; border-left: 3px solid var(--line);
    background: var(--bg); border-radius: 0 6px 6px 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; white-space: pre-wrap; overflow-x: auto;
  }
  .cite { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cite a { color: var(--accent); text-decoration: none; }
  .cite a:hover { text-decoration: underline; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.no { color: var(--dead); border-color: var(--dead); }
  .badge.route { color: var(--muted); border-color: var(--line); }

  details.sources { margin-top: 8px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .src { padding: 8px 0; border-top: 1px solid var(--line); }
  .src .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .src .head a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .src .sec { color: var(--muted); font-size: 12px; margin-left: 2px; }
  .src .sec .used { color: var(--ok); }
  .alert {
    margin-top: 5px; padding: 6px 9px; border-radius: 6px;
    background: var(--warn-bg); color: var(--warn); font-size: 12px;
  }
  .alert.dead { color: var(--dead); }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-height: 140px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea:disabled { opacity: .55; }
  .notice {
    max-width: 760px; margin: 0 auto 10px; padding: 8px 12px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn); font-size: 13px;
  }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; font-size: 14px; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); }
  .thinking { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>RFC Chat</h1>
  <span class="sub">DNS specifications, with verified quotes</span>
  <span class="spacer"></span>
  <div id="meter" hidden>
    <div class="label"><span id="meter-text"></span></div>
    <div class="bar"><div class="fill" id="meter-fill"></div></div>
  </div>
  <button id="new">New chat</button>
</header>

<main><div class="thread" id="thread">
  <div class="empty">
    Ask about DNS specifications.<br>
    Try <code>is RFC 2065 still current</code> or <code>what is the maximum length of a DNS label</code>
  </div>
</div></main>

<footer>
  <div class="notice" id="notice" hidden></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</footer>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread'), input = $('input'), notice = $('notice');
let chatId = null, busy = false, closed = false;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function clearEmpty() { thread.querySelector('.empty')?.remove(); }
function scroll() { requestAnimationFrame(() => thread.lastElementChild?.scrollIntoView({block:'end'})); }

function say(role, html, cls = '') {
  clearEmpty();
  const el = document.createElement('div');
  el.className = `turn ${role} ${cls}`;
  el.innerHTML = `<div class="bubble">${html}</div>`;
  thread.append(el);
  scroll();
  return el;
}

function sourcesHtml(sources) {
  if (!sources?.length) return '';
  const rows = sources.map(s => {
    const secs = (s.sections || []).map(x =>
      `<span class="sec">§${esc(x.section ?? '—')}${x.quoted ? ' <span class="used">quoted</span>' : ''}</span>`
    ).join(' ');
    const st = s.status;
    let alert = '';
    if (st?.obsolete) {
      alert = `<div class="alert dead">Obsolete — read ${
        (st.read_instead || []).map(n => `RFC ${n}`).join(', ') || 'its replacement'}</div>`;
    } else if (st?.updated_by_count) {
      alert = `<div class="alert">Still current, but ${st.updated_by_count} later RFC${
        st.updated_by_count === 1 ? '' : 's'} changed parts of it</div>`;
    }
    return `<div class="src"><div class="head">
      <a href="${esc(s.url)}" target="_blank" rel="noopener">RFC ${esc(s.rfc)}</a>${secs}
    </div>${alert}</div>`;
  }).join('');
  return `<details class="sources"><summary>${sources.length} document${
    sources.length === 1 ? '' : 's'} researched</summary>${rows}</details>`;
}

function factHtml(f) {
  if (!f) return '';
  const rows = [];
  rows.push(`<div class="src"><div class="head">
    <a href="https://www.rfc-editor.org/rfc/rfc${esc(f.rfc)}" target="_blank" rel="noopener">RFC ${esc(f.rfc)}</a>
    <span class="sec">${esc(f.status || '')}</span></div>`);
  if (f.obsolete) {
    const direct = (f.replaced_by || []).map(n => `RFC ${n}`).join(', ');
    const live = (f.read_instead || []).map(n => `RFC ${n}`).join(', ');
    rows.push(`<div class="alert dead">Obsolete — replaced by ${esc(direct)}${
      live && live !== direct ? `, which leads to ${esc(live)}` : ''}</div>`);
  } else if (f.updated_by?.length) {
    const shown = f.updated_by.slice(0, 8).map(n =>
      `<a href="https://www.rfc-editor.org/rfc/rfc${n}" target="_blank" rel="noopener">${n}</a>`).join(', ');
    const more = f.updated_by.length > 8 ? ` and ${f.updated_by.length - 8} more` : '';
    rows.push(`<div class="alert">Still current, but changed by ${f.updated_by.length} later RFCs: ${shown}${more}</div>`);
  }
  rows.push('</div>');
  return `<details class="sources" open><summary>supersession</summary>${rows.join('')}</details>`;
}

function changesHtml(changes) {
  if (!changes?.length) return '';
  const rows = changes.map(c => `<div class="src"><div class="head">
    <a href="https://www.rfc-editor.org/rfc/rfc${esc(c.rfc)}" target="_blank" rel="noopener">RFC ${esc(c.rfc)}</a>
    <span class="sec">${esc(c.year)} · ${c.kind === 'obsoletes' ? 'replaced' : 'updated'}
    <a href="https://www.rfc-editor.org/rfc/rfc${esc(c.affects)}" target="_blank" rel="noopener">RFC ${esc(c.affects)}</a>
    — ${esc(c.affects_title)}</span></div></div>`).join('');
  return `<details class="sources" open><summary>${changes.length} most recent changes</summary>${rows}</details>`;
}

function answerHtml(d) {
  let html = '';
  if (d.inferred_subject) {
    html += `<div class="alert">No RFC was named, so the document below was inferred from the question.</div>`;
  }
  html += `<div>${esc(d.answer)}</div>`;
  if (d.quote) {
    const src = (d.sources || []).flatMap(s =>
      (s.sections || []).filter(x => x.quoted).map(x => ({ ...x, rfc: s.rfc })))[0];
    html += `<div class="quote">${esc(d.quote)}</div><div class="cite">`;
    if (src) html += `<a href="${esc(src.url)}" target="_blank" rel="noopener">RFC ${
      esc(src.rfc)} §${esc(src.section ?? '')}</a>`;
    html += d.verified
      ? `<span class="badge ok">quote verified</span>`
      : `<span class="badge no">unverified</span>`;
    html += `<span class="badge route">${esc(d.route)}</span></div>`;
  } else {
    html += `<div class="cite"><span class="badge route">${esc(d.route)}</span></div>`;
  }
  return html + changesHtml(d.changes) + factHtml(d.fact) + sourcesHtml(d.sources);
}

function meter(chat) {
  if (!chat) return $('meter').hidden = true;
  $('meter').hidden = false;
  const pct = Math.min(100, Math.round(chat.tokens_used / chat.token_budget * 100));
  $('meter-fill').style.width = pct + '%';
  $('meter-fill').classList.toggle('full', chat.readonly);
  $('meter-text').textContent = chat.readonly
    ? 'chat closed'
    : `${chat.tokens_used.toLocaleString()} / ${chat.token_budget.toLocaleString()} tokens · ${chat.turns_left} turns left`;
  setLocked(chat.readonly, chat.readonly
    ? 'This chat reached its limit and is read-only. Start a new chat to continue.' : '');
}

// `closed` is the chat's own state and `busy` is this request's. They are kept
// apart because deriving one from input.disabled means the busy flag looks
// like a closed chat, and the input never comes back.
function setLocked(locked, message) {
  closed = locked;
  refresh(message);
}

function refresh(message) {
  const stop = closed || busy;
  input.disabled = stop;
  $('send').disabled = stop;
  if (message !== undefined) {
    notice.hidden = !message;
    notice.textContent = message || '';
  }
  if (!stop) input.focus();
}

async function api(path, options) {
  const r = await fetch(path, options);
  let body = {};
  try { body = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(body.error || `HTTP ${r.status}`), { status: r.status, body });
  return body;
}

async function newChat() {
  chatId = null;
  thread.innerHTML = `<div class="empty">Ask about DNS specifications.<br>
    Try <code>is RFC 2065 still current</code> or <code>what is the maximum length of a DNS label</code></div>`;
  meter(null);
  closed = false;
  refresh('');
}

$('new').onclick = newChat;

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});

$('form').onsubmit = async e => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question || busy) return;

  busy = true;
  refresh();
  input.value = '';
  input.style.height = 'auto';
  say('user', esc(question));
  const pending = say('assistant', '<span class="thinking">searching the RFCs…</span>');

  try {
    if (!chatId) chatId = (await api('/chats', { method: 'POST' })).id;
    const d = await api(`/chats/${chatId}/messages`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    pending.querySelector('.bubble').innerHTML = answerHtml(d);
    if (d.resolved_question) {
      pending.insertAdjacentHTML('beforebegin',
        `<div class="turn user"><div class="resolved">searched as: ${esc(d.resolved_question)}</div></div>`);
    }
    meter(d.chat);
  } catch (err) {
    pending.querySelector('.bubble').innerHTML =
      `<div class="alert ${err.status >= 500 ? 'dead' : ''}">${esc(err.message)}</div>`;
    if (err.status === 409) meter({ ...(err.body.chat || {}), readonly: true,
                                    tokens_used: 1, token_budget: 1, turns_left: 0 });
  } finally {
    busy = false;
    refresh();
    scroll();
  }
};
</script>
</body>
</html>
